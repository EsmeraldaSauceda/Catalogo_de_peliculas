<div class="container">

  <h1>Catálogo de Películas</h1>

  <div class="movies-grid">

    <div class="movie-card" *ngFor="let movie of movies">

      <img [src]="movie.cover" alt="">

      <h2>{{ movie.title }}</h2>

      <p>{{ movie.genre }}</p>

      <p>{{ movie.year }}</p>

      <button>Editar</button>

      <button (click)="deleteMovie(movie.id!)">
        Eliminar
      </button>

    </div>

  </div>

</div>
